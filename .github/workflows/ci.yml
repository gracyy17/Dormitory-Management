name: CI - Code Quality & Build

on:
  push:
    branches:
      - main
      - admin
      - tenant
      - feature/**
  pull_request:
    branches:
      - main
      - admin
      - tenant

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Lint & Build Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build
