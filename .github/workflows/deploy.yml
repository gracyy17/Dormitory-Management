name: CD - Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - admin
      - tenant
      - public-page

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Before Deploy
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase build secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "${VITE_FIREBASE_API_KEY:-}" ] || missing+=("FIREBASE_API_KEY")
          [ -n "${VITE_FIREBASE_AUTH_DOMAIN:-}" ] || missing+=("FIREBASE_AUTH_DOMAIN")
          [ -n "${VITE_FIREBASE_PROJECT_ID:-}" ] || missing+=("FIREBASE_PROJECT_ID")
          [ -n "${VITE_FIREBASE_STORAGE_BUCKET:-}" ] || missing+=("FIREBASE_STORAGE_BUCKET")
          [ -n "${VITE_FIREBASE_MESSAGING_SENDER_ID:-}" ] || missing+=("FIREBASE_MESSAGING_SENDER_ID")
          [ -n "${VITE_FIREBASE_APP_ID:-}" ] || missing+=("FIREBASE_APP_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            echo "Add these in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          malformed=()
          [[ "${VITE_FIREBASE_API_KEY}" == FIREBASE_API_KEY=* || "${VITE_FIREBASE_API_KEY}" == VITE_FIREBASE_API_KEY=* ]] && malformed+=("FIREBASE_API_KEY")
          [[ "${VITE_FIREBASE_AUTH_DOMAIN}" == FIREBASE_AUTH_DOMAIN=* || "${VITE_FIREBASE_AUTH_DOMAIN}" == VITE_FIREBASE_AUTH_DOMAIN=* ]] && malformed+=("FIREBASE_AUTH_DOMAIN")
          [[ "${VITE_FIREBASE_PROJECT_ID}" == FIREBASE_PROJECT_ID=* || "${VITE_FIREBASE_PROJECT_ID}" == VITE_FIREBASE_PROJECT_ID=* ]] && malformed+=("FIREBASE_PROJECT_ID")
          [[ "${VITE_FIREBASE_STORAGE_BUCKET}" == FIREBASE_STORAGE_BUCKET=* || "${VITE_FIREBASE_STORAGE_BUCKET}" == VITE_FIREBASE_STORAGE_BUCKET=* ]] && malformed+=("FIREBASE_STORAGE_BUCKET")
          [[ "${VITE_FIREBASE_MESSAGING_SENDER_ID}" == FIREBASE_MESSAGING_SENDER_ID=* || "${VITE_FIREBASE_MESSAGING_SENDER_ID}" == VITE_FIREBASE_MESSAGING_SENDER_ID=* ]] && malformed+=("FIREBASE_MESSAGING_SENDER_ID")
          [[ "${VITE_FIREBASE_APP_ID}" == FIREBASE_APP_ID=* || "${VITE_FIREBASE_APP_ID}" == VITE_FIREBASE_APP_ID=* ]] && malformed+=("FIREBASE_APP_ID")

          if [ ${#malformed[@]} -gt 0 ]; then
            echo "Malformed Firebase values detected for: ${malformed[*]}"
            echo "Use only raw values in GitHub Secrets/Variables (no NAME= prefix)."
            exit 1
          fi

          echo "All required Firebase build secrets are present."

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Firebase Hosting
    needs: validate
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/dorm-27fe2-firebase-adminsdk-fbsvc-634e7e241c.json
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase build secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "${VITE_FIREBASE_API_KEY:-}" ] || missing+=("FIREBASE_API_KEY")
          [ -n "${VITE_FIREBASE_AUTH_DOMAIN:-}" ] || missing+=("FIREBASE_AUTH_DOMAIN")
          [ -n "${VITE_FIREBASE_PROJECT_ID:-}" ] || missing+=("FIREBASE_PROJECT_ID")
          [ -n "${VITE_FIREBASE_STORAGE_BUCKET:-}" ] || missing+=("FIREBASE_STORAGE_BUCKET")
          [ -n "${VITE_FIREBASE_MESSAGING_SENDER_ID:-}" ] || missing+=("FIREBASE_MESSAGING_SENDER_ID")
          [ -n "${VITE_FIREBASE_APP_ID:-}" ] || missing+=("FIREBASE_APP_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            echo "Add these in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          malformed=()
          [[ "${VITE_FIREBASE_API_KEY}" == FIREBASE_API_KEY=* || "${VITE_FIREBASE_API_KEY}" == VITE_FIREBASE_API_KEY=* ]] && malformed+=("FIREBASE_API_KEY")
          [[ "${VITE_FIREBASE_AUTH_DOMAIN}" == FIREBASE_AUTH_DOMAIN=* || "${VITE_FIREBASE_AUTH_DOMAIN}" == VITE_FIREBASE_AUTH_DOMAIN=* ]] && malformed+=("FIREBASE_AUTH_DOMAIN")
          [[ "${VITE_FIREBASE_PROJECT_ID}" == FIREBASE_PROJECT_ID=* || "${VITE_FIREBASE_PROJECT_ID}" == VITE_FIREBASE_PROJECT_ID=* ]] && malformed+=("FIREBASE_PROJECT_ID")
          [[ "${VITE_FIREBASE_STORAGE_BUCKET}" == FIREBASE_STORAGE_BUCKET=* || "${VITE_FIREBASE_STORAGE_BUCKET}" == VITE_FIREBASE_STORAGE_BUCKET=* ]] && malformed+=("FIREBASE_STORAGE_BUCKET")
          [[ "${VITE_FIREBASE_MESSAGING_SENDER_ID}" == FIREBASE_MESSAGING_SENDER_ID=* || "${VITE_FIREBASE_MESSAGING_SENDER_ID}" == VITE_FIREBASE_MESSAGING_SENDER_ID=* ]] && malformed+=("FIREBASE_MESSAGING_SENDER_ID")
          [[ "${VITE_FIREBASE_APP_ID}" == FIREBASE_APP_ID=* || "${VITE_FIREBASE_APP_ID}" == VITE_FIREBASE_APP_ID=* ]] && malformed+=("FIREBASE_APP_ID")

          if [ ${#malformed[@]} -gt 0 ]; then
            echo "Malformed Firebase values detected for: ${malformed[*]}"
            echo "Use only raw values in GitHub Secrets/Variables (no NAME= prefix)."
            exit 1
          fi

          echo "All required Firebase build secrets are present."

      - name: Build for production
        run: npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Create service account file from secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_DORM_27FE2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DORM_27FE2 }}
        run: |
          set -euo pipefail

          validate_service_account_json() {
            local file_path="$1"
            grep -q '"type"[[:space:]]*:[[:space:]]*"service_account"' "$file_path" \
              && grep -q '"project_id"[[:space:]]*:[[:space:]]*"' "$file_path" \
              && grep -q '"private_key"[[:space:]]*:[[:space:]]*"' "$file_path" \
              && grep -q '"client_email"[[:space:]]*:[[:space:]]*"' "$file_path"
          }

          SERVICE_ACCOUNT_VALUE=""

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            SERVICE_ACCOUNT_VALUE="$FIREBASE_SERVICE_ACCOUNT"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_DORM_27FE2" ]; then
            SERVICE_ACCOUNT_VALUE="$FIREBASE_SERVICE_ACCOUNT_DORM_27FE2"
          else
            echo "Missing Firebase service account secret. Add FIREBASE_SERVICE_ACCOUNT in GitHub Actions secrets."
            exit 1
          fi

          printf '%s' "$SERVICE_ACCOUNT_VALUE" > "$GOOGLE_APPLICATION_CREDENTIALS"

          if validate_service_account_json "$GOOGLE_APPLICATION_CREDENTIALS"; then
            echo "Service account secret parsed as raw JSON."
            exit 0
          fi

          if printf '%s' "$SERVICE_ACCOUNT_VALUE" | base64 --decode > "$GOOGLE_APPLICATION_CREDENTIALS" 2>/dev/null \
            && validate_service_account_json "$GOOGLE_APPLICATION_CREDENTIALS"; then
            echo "Service account secret parsed as base64 JSON."
            exit 0
          fi

          echo "Invalid Firebase service account secret format."
          echo "Set FIREBASE_SERVICE_ACCOUNT as either raw JSON or base64-encoded JSON for a service account key."
          exit 1

      - name: Verify service account file
        run: |
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Service account file found."

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project dorm-27fe2 --non-interactive
