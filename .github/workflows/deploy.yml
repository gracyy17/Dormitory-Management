name: CD - Deploy to Firebase Hosting

'on':
  push:
    branches:
      - main
      - admin
      - tenant

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Before Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Firebase Hosting
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Resolve Firebase service account
        id: firebase_sa
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            {
              echo "value<<EOF"
              echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DORM_27FE2 }}" ]; then
            {
              echo "value<<EOF"
              echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DORM_27FE2 }}'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "dorm-27fe2-firebase-adminsdk-fbsvc-634e7e241c.json" ]; then
            {
              echo "value<<EOF"
              cat dorm-27fe2-firebase-adminsdk-fbsvc-634e7e241c.json
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Firebase service account not found in secrets or repository key file."
          exit 1

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: ${{ steps.firebase_sa.outputs.value }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
