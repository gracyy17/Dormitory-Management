name: CD - Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - admin
      - tenant

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Before Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Firebase Hosting
    needs: validate
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/dorm-27fe2-firebase-adminsdk-fbsvc-634e7e241c.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify service account file
        run: |
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Service account file found."

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project dorm-27fe2 --non-interactive
